version: '3.8'

services:
  # 1. Base de Dados (Persistência para a Evolution API)
  postgres-reservatorio:
    image: postgres:16-alpine
    container_name: postgres-reservatorio
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin_monitor}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${EVOLUTION_DB_NAME:-evolution_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rede-monitoramento-hidrico

  # 2. Redis (Cache de Performance)
  redis-reservatorio:
    image: redis:7-alpine
    container_name: redis-reservatorio
    restart: unless-stopped
    networks:
      - rede-monitoramento-hidrico

  # 3. Evolution API v2.3.7 (Interface WhatsApp)
  evolution-reservatorio:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-reservatorio
    restart: unless-stopped
    ports:
      - "9095:8080"
    environment:
      - SERVER_URL=http://evolution-reservatorio:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      
      # Conexão com o Banco conforme a lógica fornecida
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-admin_monitor}:${POSTGRES_PASSWORD}@postgres-reservatorio:5432/${EVOLUTION_DB_NAME:-evolution_db}?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=monitor_hidrico_v2
      
      # Cache Redis
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis-reservatorio:6379/0
      - CACHE_LOCAL_ENABLED=false
      
      - CONFIG_SESSION_PHONE_WATCH=true
      - QRCODE_LIMIT=30
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - rede-monitoramento-hidrico
    depends_on:
      postgres-reservatorio:
        condition: service_started
      redis-reservatorio:
        condition: service_started

  # 4. Bot de Monitoramento (Lógica de Decisão)
  bot-monitor:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: bot-monitor-hidrico
    restart: unless-stopped
    environment:
      - EVOLUTION_URL=http://evolution-reservatorio:8080
      - EVOLUTION_API_TOKEN=${EVOLUTION_API_KEY}
      - INSTANCE_NAME=${INSTANCE_NAME:-reservatorio-slz}
      - NIVEL_CRITICO=15 # Percentual planejado no TAP
    networks:
      - rede-monitoramento-hidrico
    depends_on:
      evolution-reservatorio:
        condition: service_healthy

networks:
  rede-monitoramento-hidrico:
    driver: bridge

volumes:
  postgres_data:
  evolution_instances:
